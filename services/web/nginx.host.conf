# ─── Host nginx reverse proxy — zonkegame.co.za ───────────────────────────────
#
# This file lives in the repo at services/web/nginx.host.conf and is deployed
# to /etc/nginx/sites-available/zonkegame.co.za on the server, matching every
# other site on this host (see /opt/hungu, /opt/xwall, /opt/lulamisapay).
#
# Every site on this server gets its own file here and its own container bound
# to 127.0.0.1 only - this host nginx is the single internet-facing hop that
# terminates TLS and proxies inward. Nothing here is shared with another app.
#
# Requirements (handled by scripts/setup-ssl.sh):
#   - nginx and certbot installed on host
#   - cert at /etc/letsencrypt/live/zonkegame.co.za/  (certbot certonly)
#   - the zonkegame-web container running and healthy on 127.0.0.1:8090
#   - the zonkegame-api container running and healthy on 127.0.0.1:4000
#   - /etc/nginx/.htpasswd_zonkegame_stats  (same Basic Auth pattern as
#     lulamisapay's /monitor) - gates /api/stats, never the public game endpoints
#   - this file symlinked into /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# Per-IP request limits (these two lines sit in nginx's http context, which is
# where sites-enabled files are included). Behind South African mobile carriers
# many players share one IP, so the API limit is generous; it exists to blunt a
# flood, not to police normal play. The API also limits score and event posts
# itself (api/src/rateLimit.ts).
limit_req_zone $binary_remote_addr zone=zonke_api:10m rate=10r/s;
# Maps a WebSocket upgrade request to the Connection header it needs, and leaves ordinary
# requests alone - the standard nginx idiom, required for the /api/ws lobby socket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# /api/stats is behind a password: this slows guessing to a trickle. Repeated
# wrong passwords also get the IP banned by fail2ban's nginx-http-auth jail.
limit_req_zone $binary_remote_addr zone=zonke_stats:10m rate=30r/m;

# HTTP — redirect everything to HTTPS; allow the ACME challenge through.
server {
    listen 80;
    server_name zonkegame.co.za www.zonkegame.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — terminate SSL, proxy to the zonkegame container on localhost:8090.
server {
    listen 443 ssl;
    server_name zonkegame.co.za www.zonkegame.co.za;

    ssl_certificate     /etc/letsencrypt/live/zonkegame.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonkegame.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    limit_req_status 429;

    # Browser hardening for every response. The web container already sends
    # nosniff, X-Frame-Options, Referrer-Policy and Permissions-Policy for the
    # site itself (services/web/nginx.container.conf); these are the two it
    # can't: HSTS belongs with TLS, and the CSP is set where the HTML is served
    # to the internet. No location below sets add_header, so these apply to all.
    #
    # The CSP allows exactly one inline script, by hash: the viewport-height
    # fallback in index.html. If that script changes, its hash must too, or
    # browsers will block it. Regenerate with:
    #   curl -s https://zonkegame.co.za/ | python3 -c "import re,sys,hashlib,base64;[print(base64.b64encode(hashlib.sha256(s.encode()).digest()).decode()) for s in re.findall(r'<script>(.*?)</script>', sys.stdin.read(), re.S)]"
    # Checked against a full game in a browser on 2026-09-14 with no violations.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-H8NH037NbQ4JsMdxWaS4kN1CfgjrpClTrxetl1KHU6Q='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Analytics/stats reading is never public - same Basic Auth pattern as
    # app.lulamisapay.co.za's /monitor. Longer prefix than /api/ below, so nginx
    # matches this one first for anything under /api/stats regardless of file order.
    location /api/stats {
        auth_basic           "Zonke stats";
        auth_basic_user_file /etc/nginx/.htpasswd_zonkegame_stats;
        limit_req            zone=zonke_stats burst=20 nodelay;
        # JSON/HTML from the API has no hardening headers of its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass         http://127.0.0.1:4000/stats;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # The game's own score/event submissions - public by necessity, hardened at the
    # app level instead (input validation + a per-IP rate limit in api/src/rateLimit.ts).
    location /api/ {
        limit_req          zone=zonke_api burst=40 nodelay;
        # add_header here replaces (doesn't add to) the server-level ones, so HSTS
        # and the CSP are repeated alongside the two the API responses lack.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        # The waiting room is a WebSocket at /api/ws. Without these two headers nginx
        # answers the upgrade with a plain 200 and online play never connects, while every
        # REST call carries on working - so it fails in a way that looks like a client bug.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # A lobby socket is idle between turns; the default 60s read timeout would cut it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
    }
}
