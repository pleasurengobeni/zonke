# ─── Host nginx reverse proxy — zonkegame.co.za ───────────────────────────────
#
# This file lives in the repo at services/web/nginx.host.conf and is deployed
# to /etc/nginx/sites-available/zonkegame.co.za on the server, matching every
# other site on this host (see /opt/hungu, /opt/xwall, /opt/lulamisapay).
#
# Every site on this server gets its own file here and its own container bound
# to 127.0.0.1 only - this host nginx is the single internet-facing hop that
# terminates TLS and proxies inward. Nothing here is shared with another app.
#
# Requirements (handled by scripts/setup-ssl.sh):
#   - nginx and certbot installed on host
#   - cert at /etc/letsencrypt/live/zonkegame.co.za/  (certbot certonly)
#   - the zonkegame-web container running and healthy on 127.0.0.1:8090
#   - the zonkegame-api container running and healthy on 127.0.0.1:4000
#   - /etc/nginx/.htpasswd_zonkegame_stats  (same Basic Auth pattern as
#     lulamisapay's /monitor) - gates /api/stats, never the public game endpoints
#   - this file symlinked into /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# HTTP — redirect everything to HTTPS; allow the ACME challenge through.
server {
    listen 80;
    server_name zonkegame.co.za www.zonkegame.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — terminate SSL, proxy to the zonkegame container on localhost:8090.
server {
    listen 443 ssl;
    server_name zonkegame.co.za www.zonkegame.co.za;

    ssl_certificate     /etc/letsencrypt/live/zonkegame.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonkegame.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Analytics/stats reading is never public - same Basic Auth pattern as
    # app.lulamisapay.co.za's /monitor. Longer prefix than /api/ below, so nginx
    # matches this one first for anything under /api/stats regardless of file order.
    location /api/stats {
        auth_basic           "Zonke stats";
        auth_basic_user_file /etc/nginx/.htpasswd_zonkegame_stats;

        proxy_pass         http://127.0.0.1:4000/stats;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # The game's own score/event submissions - public by necessity, hardened at the
    # app level instead (input validation + a per-IP rate limit in api/src/rateLimit.ts).
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
    }
}
