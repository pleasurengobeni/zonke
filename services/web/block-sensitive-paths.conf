# Scanners probe every host on this box for dotfiles, PHP shells and
# WordPress entry points. Apps that proxy a catch-all route answer 200 to
# any path, which scanners log as a hit and escalate on. These rules answer
# at the edge instead, before the request reaches an upstream.
#
# The (?!well-known) lookahead is load-bearing: regex locations take
# precedence over the plain-prefix /.well-known/acme-challenge/ blocks every
# vhost uses, so without it Lets Encrypt renewal breaks silently.

location ~ ^/\.(?!well-known) {
    return 404;
}

location ~* \.(php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|pl|sh|bak|old|save|swp|sql|tar|gz|tgz|zip|7z|rar)$ {
    return 404;
}

location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc|phpmyadmin|pma|myadmin|adminer|cgi-bin|vendor/phpunit|_profiler)(/|$) {
    return 404;
}
