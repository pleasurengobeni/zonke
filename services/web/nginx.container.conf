server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # add_header does not inherit across nesting levels once a block defines its own - a
    # location that sets its own Cache-Control silently drops any server-level add_header
    # for that response instead of adding to it. So the same four hardening headers are
    # repeated in every location below rather than declared once here.

    # Vite content-hashes filenames, so these can be cached hard.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # index.html names the current hashed bundle - it must always be revalidated, or a
    # tab left open across a deploy keeps loading an old one with no reason to re-fetch it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    gzip on;
    gzip_types application/javascript text/css text/html;
    gzip_min_length 1024;
}
