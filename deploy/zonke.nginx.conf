# Zonke game - served on its own port, from its own root, as its own site file.
# Nothing here touches the existing lulamisapay.co.za vhost.
server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;

    root /var/www/zonke;
    index index.html;

    # Vite emits content-hashed filenames, so assets can be cached hard.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the entry point that names the current hashed JS bundle - it must never
    # be cached, or a browser tab left open across a deploy keeps loading an old bundle
    # (and could go on doing so indefinitely, since it never has a reason to re-fetch it).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types application/javascript text/css text/html;
    gzip_min_length 1024;
}
